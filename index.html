<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antojitos Maestro - UPTAIT</title>
    <meta name="google-site-verification" content="VSZPXOEtAUgP3MLla9kXNxPd7Ga2EcecufhXqHel_ls" />
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --oro: #d4af37; --negro: #000; --gris: #121212; --verde: #2ecc71; --rojo: #e74c3c; --blanco: #ffffff; }
        body { background: var(--negro); color: var(--oro); font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 0; }
        .seccion { display: none; padding: 20px; box-sizing: border-box; animation: fadeIn 0.3s; }
        .activa { display: block; }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
        .container { max-width: 500px; margin: auto; background: #050505; min-height: 100vh; border-left: 1px solid #222; border-right: 1px solid #222; position: relative; }
        h1 { text-align: center; text-transform: uppercase; letter-spacing: 3px; margin-top: 40px; font-size: 2em; }
        input, button, textarea { width: 100%; padding: 12px; margin: 8px 0; border-radius: 10px; border: 1px solid var(--oro); font-weight: bold; box-sizing: border-box; }
        textarea { background: #111; color: white; height: 60px; resize: none; border-color: #333; font-weight: normal; }
        button { background: var(--oro); color: #000; cursor: pointer; border: none; transition: 0.2s; }
        .cat-titulo { background: var(--oro); color: #000; padding: 8px; border-radius: 6px; margin: 25px 0 10px; text-align: center; font-weight: 900; }
        .producto-card { background: var(--gris); padding: 15px; border-radius: 15px; margin-bottom: 15px; border: 1px solid #222; }
        .ingredientes-texto { color: #888; font-size: 0.85em; margin: 5px 0 10px 0; display: block; font-style: italic; }
        .caja-total { background: #0a0a0a; border: 2px solid var(--verde); color: var(--verde); padding: 15px; border-radius: 12px; font-size: 1.3em; text-align: center; margin: 15px 0; }
        .ticket-carlos { background: var(--blanco); color: #000; padding: 15px; border-radius: 12px; margin-bottom: 15px; border-left: 10px solid var(--verde); }
        .footer-carrito { position: sticky; bottom: 0; background: #000; padding: 15px; border-top: 3px solid var(--oro); text-align: center; z-index: 100; }
    </style>
</head>
<body>

<div class="container">
    <div id="p-inicio" class="seccion activa">
        <h1 style="margin-top:80px">ANTOJITOS</h1>
        <button onclick="irSeccion('p-login')">MENU CLIENTE</button>
        <button style="background:none; color:white; border:1px solid #333; margin-top:40px" onclick="entrarCarlos()">ADMINISTRACIÓN</button>
    </div>

    <div id="p-login" class="seccion">
        <h1>TU NOMBRE</h1>
        <input type="text" id="nombre-usuario" placeholder="Ej: Carlos Acosta">
        <button onclick="abrirMenu()">VER LA CARTA</button>
    </div>

    <div id="p-menu" class="seccion">
        <div id="promo-dia" style="background:var(--oro); color:black; padding:10px; border-radius:10px; margin-bottom:15px; text-align:center; font-weight:bold; display:none"></div>
        <div id="lista-menu"></div>
        <div class="footer-carrito" id="barra-pedido">
            <span style="color:white">Total: <b>$<span id="monto-carrito">0</span></b></span>
            <button onclick="procesarPedido()" style="background:var(--verde); color:white">PEDIR AHORA</button>
        </div>
    </div>

    <div id="p-carlos" class="seccion">
        <h2 style="color:var(--verde); text-align:center">PANEL DE CONTROL</h2>
        
        <!-- BOTÓN DE ACTIVACIÓN DE AUDIO REINSTALADO -->
        <button id="btn-audio" onclick="activarAudio()" style="background:var(--rojo); color:white; margin-bottom:10px;">🔔 ACTIVAR SONIDO DE PEDIDOS</button>

        <div class="caja-total">💰 VENTAS DE HOY: $<span id="suma-dinero">0</span></div>
        
        <button onclick="toggleEditor()" style="background:#222; color:var(--oro)">⚙️ EDITAR MENÚ E INGREDIENTES</button>
        
        <div id="editor-precios" style="display:none; margin-top:15px">
            <div style="background:#111; padding:10px; border-radius:8px; margin-bottom:15px">
                <label>PROMOCIÓN ACTIVA:</label>
                <input type="text" id="input-promo" placeholder="Ej: Solo hoy 2x1 en Perros">
                <button onclick="actualizarPromo()" style="background:var(--verde); color:white">GUARDAR PROMO</button>
            </div>
            <div id="lista-editor"></div>
        </div>

        <h3 style="margin-top:25px">PEDIDOS POR ENTREGAR:</h3>
        <div id="contenedor-pedidos-carlos"></div>
        <button onclick="location.reload()" style="background:none; color:#444">SALIR</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "AIzaSyDpndWo-syEwXo__nBs-aD6rtDSTY36YCY", databaseURL: "https://antojitosweb-default-rtdb.firebaseio.com", projectId: "antojitosweb" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let menuDinamico = [
        {cat:'POLLO A LA BROASTER', nom:'1 pieza de pollo', pre:8000, desc:'ensalada, papa a la francesa'},
        {cat:'POLLO A LA BROASTER', nom:'2 piezas de pollo', pre:12000, desc:'ensalada, papa a la francesa'},
        {cat:'POLLO A LA BROASTER', nom:'3 piezas de pollo', pre:16000, desc:'ensalada, papa a la francesa'},
        {cat:'POLLO A LA BROASTER', nom:'4 piezas de pollo', pre:21000, desc:'ensalada, papa a la francesa'},
        {cat:'POLLO A LA BROASTER', nom:'8 piezas de pollo', pre:40000, desc:'ensalada, papa a la francesa'},
        {cat:'SALCHIPAPA', nom:"Salchipapa personal: 'Ta' bien'", pre:8000, desc:'Papas a la francesa, salchicha, vegetales, queso'},
        {cat:'SALCHIPAPA', nom:"Salchipapa mediana: 'Gustico'", pre:13000, desc:'Papas a la francesa, salchicha, vegetales, queso, tocineta, una porción mixta de carne y pollo'},
        {cat:'SALCHIPAPA', nom:"Salchipapa 'Súper antojitos'", pre:19000, desc:'Papas a la francesa, salchicha, vegetales, queso, dos porciones de proteína, tocineta'},
        {cat:'HAMBURGUESAS', nom:'Hamburguesa Mini (Carne)', pre:6000, desc:'Pan, croqueta de carne, vegetales, papita, queso, salsa'},
        {cat:'HAMBURGUESAS', nom:'Hamburguesa Mini (Pollo)', pre:7000, desc:'Pan, pollo, vegetales, papita, queso, salsa'},
        {cat:'HAMBURGUESAS', nom:'Hamburguesa Mini (Mechada)', pre:8000, desc:'Pan, carne mechada, vegetales, papita, queso, salsa'},
        {cat:'HAMBURGUESAS', nom:"Hamburguesas 'Antojitos'", pre:9000, desc:'Pan, carne mechada, vegetales, papita, salsa, huevo, tocineta, jamón'},
        {cat:'HAMBURGUESAS', nom:"Hamburguesa 'Momo'", pre:13000, desc:'Pan, dos porciones de carne o pollo, queso tajado, huevo, aguacate, vegetales, papita, tocineta, jamón'},
        {cat:'HAMBURGUESAS', nom:"Hamburguesa 'Trifásica'", pre:19000, desc:'Pan, pollo, chuleta, carne, queso tajado, huevo, aguacate, vegetales, papita, tocineta, jamón, salsas al gusto'},
        {cat:'PERROS', nom:'Perro hambruno', pre:5000, desc:'Pan, salchicha, papitas, queso, salsas, vegetales'},
        {cat:'PERROS', nom:'Perro especial', pre:9000, desc:'Pan, salchicha, papitas, queso, salsas, carne desmechada o pollo desmechado, vegetales, jamón'},
        {cat:'PERROS', nom:'Perro americano', pre:13000, desc:'Pan, salchicha, papitas, salsas, dos proteínas, tocino, jamón, vegetales'}
    ];

    let carrito = [];
    let audioActivado = false;

    function activarAudio() {
        audioActivado = true;
        document.getElementById('btn-audio').style.background = "var(--verde)";
        document.getElementById('btn-audio').innerText = "🔔 SONIDO ACTIVADO";
        // Reproducir un sonido corto para confirmar
        const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
        audio.play();
    }

    function sonarNotificacion(cliente) {
        if (audioActivado) {
            if (Notification.permission === "granted") {
                new Notification("¡NUEVO PEDIDO!", { body: "El cliente " + cliente + " acaba de pedir." });
            }
            const audio = new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3');
            audio.play();
        }
    }

    function irSeccion(id) {
        document.querySelectorAll('.seccion').forEach(s => s.classList.remove('activa'));
        document.getElementById(id).classList.add('activa');
    }

    function abrirMenu() {
        if(!document.getElementById('nombre-usuario').value) return alert("Escribe tu nombre");
        irSeccion('p-menu');
        db.ref('config/menu').on('value', s => {
            if(s.val()) menuDinamico = s.val();
            renderMenuCliente();
        });
        db.ref('config/promo').on('value', s => {
            const p = s.val();
            const div = document.getElementById('promo-dia');
            if(p) { div.innerText = "⭐ PROMO: " + p; div.style.display = "block"; }
            else { div.style.display = "none"; }
        });
    }

    function renderMenuCliente() {
        let html = "", catActual = "";
        menuDinamico.forEach((p, i) => {
            if(p.cat !== catActual) { catActual = p.cat; html += `<div class="cat-titulo">${catActual}</div>`; }
            html += `<div class="producto-card">
                <div style="display:flex; justify-content:space-between">
                    <b>${p.nom}</b>
                    <b style="color:var(--verde)">$${p.pre}</b>
                </div>
                <span class="ingredientes-texto">${p.desc}</span>
                <button onclick="agregarAlCarrito(${i})" style="padding:5px">AGREGAR</button>
            </div>`;
        });
        document.getElementById('lista-menu').innerHTML = html;
    }

    function agregarAlCarrito(i) {
        const p = menuDinamico[i];
        carrito.push({ nombre: p.nom, categoria: p.cat, precio: Number(p.pre) });
        document.getElementById('monto-carrito').innerText = carrito.reduce((a, b) => a + b.precio, 0);
    }

    function procesarPedido() {
        if(!carrito.length) return;
        db.ref('pedidos/').push({
            cliente: document.getElementById('nombre-usuario').value,
            items: carrito,
            total: Number(document.getElementById('monto-carrito').innerText),
            listo: false, 
            timestamp: Date.now()
        });
        alert("¡Pedido enviado!");
        location.reload();
    }

    function entrarCarlos() {
        if(prompt("Contraseña:") === "antojitos2026") {
            irSeccion('p-carlos');
            escucharPedidos();
            renderEditorCarlos();
        }
    }

    function toggleEditor() {
        const d = document.getElementById('editor-precios');
        d.style.display = d.style.display === 'none' ? 'block' : 'none';
    }

    function renderEditorCarlos() {
        let html = "";
        menuDinamico.forEach((p, i) => {
            html += `<div style="background:#1a1a1a; padding:10px; border-radius:10px; margin-bottom:10px; border:1px solid #333">
                <b>${p.nom}</b><br>
                Precio: <input type="number" value="${p.pre}" onchange="actualizarItem(${i}, 'pre', this.value)" style="width:100px">
                Ingredientes: <textarea onchange="actualizarItem(${i}, 'desc', this.value)">${p.desc}</textarea>
            </div>`;
        });
        document.getElementById('lista-editor').innerHTML = html;
    }

    function actualizarItem(index, campo, valor) {
        if(campo === 'pre') menuDinamico[index].pre = Number(valor);
        else menuDinamico[index].desc = valor;
        db.ref('config/menu').set(menuDinamico);
    }

    function actualizarPromo() {
        db.ref('config/promo').set(document.getElementById('input-promo').value);
        alert("Promo actualizada");
    }

    let primerCarga = true;
    function escucharPedidos() {
        db.ref('pedidos/').on('value', snap => {
            const cont = document.getElementById('contenedor-pedidos-carlos');
            let totalDia = 0, html = "";
            
            // Obtener fecha actual en formato YYYY-MM-DD
            const hoy = new Date().toISOString().split('T')[0];

            snap.forEach(h => {
                const p = h.val();
                const fechaPedido = new Date(p.timestamp).toISOString().split('T')[0];

                // SOLO SUMAR SI ES DE HOY Y ESTÁ LISTO
                if(p.listo && fechaPedido === hoy) {
                    totalDia += Number(p.total); 
                }
                
                if(!p.listo) {
                    let itemsHtml = p.items.map(i => `• ${i.nombre}`).join('<br>');
                    html += `<div class="ticket-carlos">
                        <b>${p.cliente.toUpperCase()}</b><br>${itemsHtml}<br>
                        <b>COBRAR: $${p.total}</b>
                        <button onclick="db.ref('pedidos/${h.key}').update({listo:true})" style="background:var(--verde); margin-top:5px">ENTREGADO</button>
                    </div>`;
                    if(!primerCarga) sonarNotificacion(p.cliente);
                }
            });
            cont.innerHTML = html || "<p style='text-align:center; color:#555'>No hay pedidos</p>";
            document.getElementById('suma-dinero').innerText = totalDia.toLocaleString();
            primerCarga = false;
        });
    }
</script>
</body>
</html>
