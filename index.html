<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antojitos - Sistema Profesional V3</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --oro: #d4af37; --negro: #000; --gris: #121212; --verde: #2ecc71; --rojo: #e74c3c; }
        body { background: var(--negro); color: var(--oro); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 0; }
        .seccion { display: none; padding: 20px; box-sizing: border-box; }
        .activa { display: block; }
        .container { max-width: 500px; margin: auto; background: #050505; min-height: 100vh; border: 1px solid #222; position: relative; }
        h1 { text-align: center; text-transform: uppercase; letter-spacing: 2px; margin-top: 40px; }
        input, button, textarea { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--oro); font-weight: bold; box-sizing: border-box; }
        textarea { background: #111; color: white; height: 50px; resize: none; border-color: #444; font-weight: normal; }
        button { background: var(--oro); color: #000; cursor: pointer; border: none; }
        button:hover { background: #b8962d; }
        .cat { background: var(--oro); color: #000; padding: 8px; border-radius: 5px; margin: 25px 0 10px; text-align: center; font-weight: bold; }
        .card { background: var(--gris); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #222; }
        .card-h { display: flex; justify-content: space-between; color: #fff; font-size: 1.1em; }
        .card-d { color: #888; font-size: 0.85em; margin: 5px 0; }
        .fijo { position: sticky; bottom: 0; background: #000; padding: 15px; border-top: 2px solid var(--oro); text-align: center; }
        .ticket { background: #fff; color: #000; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 8px solid var(--verde); position: relative; }
        .nota-box { color: var(--rojo); font-weight: bold; background: #fff0f0; padding: 5px; border-radius: 4px; margin-top: 5px; border: 1px solid #ffcccc; font-size: 0.85em; }
        #notif-badge { background: var(--rojo); color: white; padding: 2px 8px; border-radius: 20px; font-size: 12px; }
    </style>
</head>
<body>
<div class="container">

    <div id="p-ini" class="seccion activa">
        <h1>ANTOJITOS</h1>
        <p style="text-align:center; color:#888">Sistema de Pedidos en Tiempo Real</p>
        <button onclick="activarYIr('p-log')">HACER MI PEDIDO</button>
        <button style="background:none; color:#fff; border:1px solid #333; margin-top:50px" onclick="activarYIrAdmin()">PANEL DE CARLOS</button>
    </div>

    <div id="p-log" class="seccion">
        <h1>TU NOMBRE</h1>
        <input type="text" id="user" placeholder="¿Quién ordena?">
        <button onclick="cargarMenu()">ENTRAR AL MENÚ</button>
    </div>

    <div id="p-menu" class="seccion">
        <h2 id="saludo" style="color:white; text-align:center"></h2>
        <div id="lista-productos"></div>
        <div id="area-pago" style="display:none; background:#111; padding:15px; border-radius:10px; border:1px solid var(--verde)">
            <p id="msg-est" style="text-align:center; margin:0"></p>
            <button id="btn-cancel" onclick="cancelarPedido()" style="background:var(--rojo); color:white; margin-top:10px">CANCELAR (60s)</button>
        </div>
        <div class="fijo" id="footer-cli">
            <h3 style="color:var(--verde)">PRODUCTOS: <span id="cant-items" style="color:white">0</span> | TOTAL: $<span id="tot">0</span></h3>
            <button onclick="enviarPedido()" style="background:var(--verde); color:white">ENVIAR A COCINA</button>
        </div>
    </div>

    <div id="p-adm" class="seccion">
        <h1 style="color:var(--verde)">COCINA - PEDIDOS</h1>
        <div id="pedidos-container"></div>
        <button onclick="location.reload()" style="background:#222; color:white">SALIR</button>
    </div>

</div>

<script>
    // Configuración Firebase
    const firebaseConfig = { 
        apiKey: "AIzaSyDpndWo-syEwXo__nBs-aD6rtDSTY36YCY", 
        databaseURL: "https://antojitosweb-default-rtdb.firebaseio.com", 
        projectId: "antojitosweb" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // Productos exactos de Carlos
    const productos = [
        {c:'POLLO A LA BROASTER', n:'1 Pieza', p:8000, d:'Con ensalada y papa francesa'},
        {c:'POLLO A LA BROASTER', n:'2 Piezas', p:12000, d:'Con ensalada y papa francesa'},
        {c:'POLLO A LA BROASTER', n:'4 Piezas', p:21000, d:'Con ensalada y papa francesa'},
        {c:'POLLO A LA BROASTER', n:'8 Piezas', p:40000, d:'Con ensalada y papa francesa'},
        {c:'SALCHIPAPAS', n:'Personal "Ta bien"', p:8000, d:'Papas, salchicha, vegetales y queso'},
        {c:'SALCHIPAPAS', n:'Mediana "Gustico"', p:13000, d:'Mixta con tocineta'},
        {c:'SALCHIPAPAS', n:'"Súper Antojitos"', p:19000, d:'Doble proteína y mucho queso'},
        {c:'HAMBURGUESAS', n:'Mini (Croqueta)', p:6000, d:'Clásica mini'},
        {c:'HAMBURGUESAS', n:'Mini (Pollo)', p:7000, d:'Pollo desmechado'},
        {c:'HAMBURGUESAS', n:'Mini (Mechada)', p:8000, d:'Carne mechada'},
        {c:'HAMBURGUESAS', n:'"Antojitos"', p:9000, d:'Mechada, huevo, tocineta y jamón'},
        {c:'HAMBURGUESAS', n:'"Momo"', p:13000, d:'2 carnes, aguacate, huevo'},
        {c:'HAMBURGUESAS', n:'"Trifásica"', p:19000, d:'Pollo, chuleta y carne'},
        {c:'PERROS', n:'Perro Hambruno', p:5000, d:'Sencillo'},
        {c:'PERROS', n:'Perro Especial', p:9000, d:'Con mechada o pollo'},
        {c:'PERROS', n:'Perro Americano', p:13000, d:'Dos proteínas y tocino'}
    ];

    let carrito = [], pid = null, seg = 60, timer;

    // Sistema de Voz con Desbloqueo
    function hablar(t) {
        window.speechSynthesis.cancel();
        const m = new SpeechSynthesisUtterance(t);
        m.lang = 'es-ES';
        m.rate = 1;
        window.speechSynthesis.speak(m);
    }

    // Activar audio antes de navegar
    function activarYIr(id) {
        hablar(""); // "Despierta" el motor de voz
        ir(id);
    }

    function activarYIrAdmin() {
        hablar("");
        const pass = prompt("Clave de Carlos:");
        if(pass === "antojitos2026") adminInit();
    }

    function ir(id) {
        document.querySelectorAll('.seccion').forEach(s => s.classList.remove('activa'));
        document.getElementById(id).classList.add('activa');
    }

    function cargarMenu() {
        if(!document.getElementById('user').value) return alert("Pon tu nombre");
        document.getElementById('saludo').innerText = "HOLA, " + document.getElementById('user').value.toUpperCase();
        ir('p-menu');
        let h = "", cActual = "";
        productos.forEach((p, i) => {
            if(p.c !== cActual) { cActual = p.c; h += `<div class="cat">${cActual}</div>`; }
            h += `<div class="card">
                    <div class="card-h"><span>${p.n}</span><span>$${p.p.toLocaleString()}</span></div>
                    <p class="card-d">${p.d}</p>
                    <textarea id="nota-${i}" placeholder="¿Deseas quitar algo? (ej: sin cebolla)"></textarea>
                    <button onclick="addCar(${i})">AÑADIR AL CARRITO</button>
                  </div>`;
        });
        document.getElementById('lista-productos').innerHTML = h;
    }

    function addCar(i) {
        const item = productos[i];
        const notaCli = document.getElementById(`nota-${i}`).value;
        // Creamos una copia nueva para que no se sobreescriba
        carrito.push({ nombre: item.n, precio: item.p, nota: notaCli });
        
        document.getElementById('cant-items').innerText = carrito.length;
        document.getElementById('tot').innerText = carrito.reduce((s, x) => s + x.precio, 0).toLocaleString();
        document.getElementById(`nota-${i}`).value = ""; // Limpiar nota
        alert("¡" + item.n + " añadido!");
    }

    function enviarPedido() {
        if(!carrito.length) return alert("Carrito vacío");
        const ref = db.ref('pedidos/').push({
            cliente: document.getElementById('user').value,
            items: carrito,
            total: document.getElementById('tot').innerText,
            listo: false, can: false, hora: new Date().toLocaleTimeString()
        });
        pid = ref.key;
        document.getElementById('footer-cli').style.display = 'none';
        document.getElementById('area-pago').style.display = 'block';
        document.getElementById('msg-est').innerText = "¡Pedido en cocina! Carlos lo recibió.";
        
        seg = 60;
        timer = setInterval(() => {
            seg--;
            document.getElementById('btn-cancel').innerText = `CANCELAR PEDIDO (${seg}s)`;
            if(seg <= 0) { clearInterval(timer); document.getElementById('btn-cancel').style.display = 'none'; }
        }, 1000);

        db.ref('pedidos/' + pid).on('value', s => {
            if(s.val()?.listo) {
                hablar("Tu pedido está listo, ven por él.");
                document.getElementById('msg-est').innerHTML = "<b style='color:var(--verde)'>¡PEDIDO LISTO!</b>";
            }
        });
    }

    function cancelarPedido() {
        if(confirm("¿Seguro que deseas cancelar?")) {
            db.ref('pedidos/' + pid).update({ can: true });
            clearInterval(timer);
            location.reload();
        }
    }

    // LÓGICA DE CARLOS
    function adminInit() {
        ir('p-adm');
        if(Notification.permission !== "granted") Notification.requestPermission();
        
        db.ref('pedidos/').on('value', snap => {
            const cont = document.getElementById('pedidos-container');
            const antes = cont.childElementCount;
            cont.innerHTML = "";
            
            snap.forEach(h => {
                const p = h.val();
                if(!p.listo) {
                    const esCan = p.can;
                    let itemsH = p.items.map(i => `• ${i.nombre} ${i.nota ? `<div class="nota-box">OJO: ${i.nota}</div>` : ''}`).join('<br>');
                    
                    cont.innerHTML += `<div class="ticket" style="${esCan?'opacity:0.4;border-left-color:red':''}">
                        <b>${p.cliente.toUpperCase()}</b> ${esCan?'<b style="color:red">[CANCELADO]</b>':''} <br><small>${p.hora}</small><br>
                        <hr>${itemsH}<hr>
                        <b>TOTAL: $${p.total}</b><br>
                        ${!esCan ? `<button onclick="db.ref('pedidos/${h.key}').update({listo:true})" style="background:var(--verde); color:white; margin-top:10px">ENTREGADO</button>` : ''}
                    </div>`;
                    
                    if(esCan && !h.vistoVoz) { hablar("Atención Carlos, un pedido ha sido cancelado"); h.vistoVoz = true; }
                }
            });

            // Sonido de Nuevo Pedido
            if(cont.childElementCount > antes && antes !== 0) {
                hablar("¡Atención Carlos! Tienes un nuevo pedido entrante.");
                new Notification("🍔 NUEVO PEDIDO EN COLA");
            }
        });
    }
</script>
</body>
</html>
