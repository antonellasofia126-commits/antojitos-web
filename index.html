<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antojitos - Menú Digital</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <style>
        body { font-family: Arial, sans-serif; background-color: #f4f4f4; padding: 20px; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 10px; margin: auto; box-shadow: 0px 4px 10px rgba(0,0,0,0.1); }
        h1 { text-align: center; color: #e67e22; }
        .producto { border-bottom: 1px solid #ddd; padding: 10px 0; }
        input, textarea { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; background-color: #27ae60; color: white; border: none; padding: 15px; font-size: 18px; border-radius: 5px; cursor: pointer; }
        button:hover { background-color: #2ecc71; }
        .label-qty { font-weight: bold; font-size: 0.9em; }
    </style>
</head>
<body>

<div class="container">
    <h1>Antojitos 🍔</h1>
    
    <label>Tu Nombre:</label>
    <input type="text" id="nombreCliente" placeholder="Ej. Maria Fernanda" required>

    <div id="lista-productos">
        <div class="producto">
            <label class="label-qty">Hamburguesa Especial</label>
            <input type="number" id="cant_hamburguesa" value="0" min="0">
            <textarea id="obs_hamburguesa" placeholder="¿Cómo la quieres? (Ej. sin cebolla)"></textarea>
        </div>

        <div class="producto">
            <label class="label-qty">Salchipapas</label>
            <input type="number" id="cant_salchipapas" value="0" min="0">
            <textarea id="obs_salchipapas" placeholder="¿Alguna salsa extra?"></textarea>
        </div>
    </div>

    <br>
    <button onclick="enviarPedido()">Confirmar Pedido</button>
</div>

<script>
    // CONFIGURACIÓN DE FIREBASE (Reemplaza con tus datos reales)
    const firebaseConfig = {
        apiKey: "TU_API_KEY",
        authDomain: "tu-proyecto.firebaseapp.com",
        databaseURL: "https://tu-proyecto.firebaseio.com",
        projectId: "tu-proyecto",
        storageBucket: "tu-proyecto.appspot.com",
        messagingSenderId: "tu-id",
        appId: "tu-app-id"
    };
    
    firebase.initializeApp(firebaseConfig);
    const database = firebase.database();

    // Pedir permiso para notificaciones al entrar
    if (Notification.permission !== "granted") {
        Notification.requestPermission();
    }

    function enviarPedido() {
        const nombre = document.getElementById('nombreCliente').value.trim();
        
        // Validación de Nombre
        if (nombre === "") {
            alert("¡Epa! Necesitamos tu nombre para preparar el pedido.");
            return;
        }

        // Captura de datos específicos
        const pedido = {
            cliente: nombre,
            detalles: {
                hamburguesas: {
                    cantidad: document.getElementById('cant_hamburguesa').value,
                    notas: document.getElementById('obs_hamburguesa').value
                },
                salchipapas: {
                    cantidad: document.getElementById('cant_salchipapas').value,
                    notas: document.getElementById('obs_salchipapas').value
                }
            },
            fecha: new Date().toLocaleString(),
            estado: "Pendiente"
        };

        // Guardar en Firebase
        database.ref('pedidos/').push(pedido)
        .then(() => {
            // Punto 2: Notificación y Mensaje de confirmación
            alert(`¡Listo ${nombre}! Recibimos tu pedido. Retíralo en caja en 30 minutos.`);
            
            if (Notification.permission === "granted") {
                new Notification("Antojitos", { body: "Tu pedido está en cocina. ¡En 30 min estará listo!" });
            }

            // Limpiar campos
            document.getElementById('nombreCliente').value = "";
            document.getElementById('cant_hamburguesa').value = "0";
            document.getElementById('cant_salchipapas').value = "0";
        })
        .catch((error) => {
            alert("Error al conectar con la base de datos.");
            console.error(error);
        });
    }
</script>

</body>
</html>
