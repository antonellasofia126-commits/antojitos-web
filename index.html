<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antojitos - El Menú de Carlos</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        :root { --oro: #d4af37; --negro: #000; --gris: #121212; --verde: #2ecc71; --rojo: #e74c3c; }
        body { background: var(--negro); color: var(--oro); font-family: 'Segoe UI', sans-serif; margin: 0; }
        .seccion { display: none; padding: 20px; }
        .activa { display: block; }
        .container { max-width: 500px; margin: auto; background: #050505; min-height: 100vh; border: 1px solid #222; }
        h1 { text-align: center; text-transform: uppercase; letter-spacing: 2px; }
        input, button, textarea { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--oro); font-weight: bold; box-sizing: border-box; }
        textarea { background: #111; color: white; height: 50px; resize: none; font-size: 14px; border-color: #444; }
        button { background: var(--oro); color: #000; cursor: pointer; border: none; }
        .cat { background: var(--oro); color: #000; padding: 8px; border-radius: 5px; margin: 25px 0 10px; text-align: center; font-weight: bold; font-size: 0.9em; }
        .card { background: var(--gris); padding: 15px; border-radius: 12px; margin-bottom: 15px; border: 1px solid #222; }
        .card-h { display: flex; justify-content: space-between; color: #fff; font-size: 1.1em; font-weight: bold; }
        .card-d { color: #888; font-size: 0.85em; margin: 5px 0 10px; line-height: 1.4; }
        .fijo { position: sticky; bottom: 0; background: #000; padding: 15px; border-top: 2px solid var(--oro); text-align: center; }
        .ticket { background: #fff; color: #000; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 8px solid var(--verde); position: relative; }
        .nota-roja { color: var(--rojo); font-weight: bold; background: #fee; padding: 5px; border-radius: 4px; margin-top: 8px; border: 1px dashed var(--rojo); font-size: 0.9em; }
    </style>
</head>
<body>
<div class="container">
    <div id="p-ini" class="seccion activa">
        <h1 style="margin-top:80px">ANTOJITOS</h1>
        <p style="text-align:center; color:#666">"Es más que un antojito y algo más"</p>
        <button onclick="ir('p-log')">ORDENAR AHORA</button>
        <button style="background:none; color:#fff; border:1px solid #333; margin-top:40px" onclick="accesoCarlos()">PANEL ADMINISTRADOR</button>
    </div>

    <div id="p-log" class="seccion">
        <h1>TU NOMBRE</h1>
        <input type="text" id="user" placeholder="Escribe tu nombre aquí...">
        <button onclick="cargarMenu()">VER EL MENÚ</button>
    </div>

    <div id="p-menu" class="seccion">
        <div id="lista"></div>
        <div id="status" style="display:none; padding:15px; border:1px solid var(--verde); border-radius:10px; background:#0a0a0a">
            <p id="msg" style="text-align:center; color:white; font-weight:bold"></p>
            <button id="btn-can" onclick="cancelar()" style="background:var(--rojo); color:#fff">CANCELAR PEDIDO (60s)</button>
        </div>
        <div class="fijo" id="f-cli">
            <h3 style="color:var(--verde); margin:5px">TOTAL: $<span id="tot">0</span></h3>
            <button onclick="enviarPedido()" style="background:var(--verde); color:#fff">CONFIRMAR PEDIDO</button>
        </div>
    </div>

    <div id="p-adm" class="seccion">
        <h1 style="color:var(--verde)">SISTEMA DE COCINA</h1>
        <div id="pedidos"></div>
        <button onclick="location.reload()" style="background:#222; color:white">SALIR</button>
    </div>
</div>

<script>
    // Configuración de tu Firebase
    const firebaseConfig = { 
        apiKey: "AIzaSyDpndWo-syEwXo__nBs-aD6rtDSTY36YCY", 
        databaseURL: "https://antojitosweb-default-rtdb.firebaseio.com", 
        projectId: "antojitosweb" 
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // MENÚ EXACTO DE CARLOS
    const menuCarlos = [
        {c:'POLLO A LA BROASTER', n:'1 Pieza de pollo', p:8000, d:'Incluye ensalada y papa a la francesa'},
        {c:'POLLO A LA BROASTER', n:'2 Piezas de pollo', p:12000, d:'Incluye ensalada y papa a la francesa'},
        {c:'POLLO A LA BROASTER', n:'4 Piezas de pollo', p:21000, d:'Incluye ensalada y papa a la francesa'},
        {c:'POLLO A LA BROASTER', n:'8 Piezas de pollo', p:40000, d:'Incluye ensalada y papa a la francesa'},
        
        {c:'SALCHIPAPAS', n:'Personal "Ta bien"', p:8000, d:'Papas a la francesa, salchicha, vegetales y queso'},
        {c:'SALCHIPAPAS', n:'Mediana "Gustico"', p:13000, d:'Papas, salchicha, vegetales, queso, tocineta y mixta (carne/pollo)'},
        {c:'SALCHIPAPAS', n:'"Súper Antojitos"', p:19000, d:'Doble porción de proteína, tocineta, papas y mucho queso'},
        
        {c:'HAMBURGUESAS', n:'Hamburguesa Mini (Croqueta)', p:6000, d:'Croqueta, vegetales, papita, queso y salsas'},
        {c:'HAMBURGUESAS', n:'Hamburguesa Mini (Pollo)', p:7000, d:'Pollo desmechado, vegetales, papita y queso'},
        {c:'HAMBURGUESAS', n:'Hamburguesa Mini (Mechada)', p:8000, d:'Carne mechada, vegetales y queso'},
        {c:'HAMBURGUESAS', n:'Hamburguesa "Antojitos"', p:9000, d:'Carne mechada, vegetales, huevo, tocineta y jamón'},
        {c:'HAMBURGUESAS', n:'Hamburguesa "Momo"', p:13000, d:'Dos proteínas, queso, huevo, aguacate, tocineta y jamón'},
        {c:'HAMBURGUESAS', n:'Hamburguesa "Trifásica"', p:19000, d:'Pollo, chuleta, carne, queso, huevo, aguacate, tocineta y jamón'},
        
        {c:'PERROS CALIENTES', n:'Perro Hambruno', p:5000, d:'Pan, salchicha, papitas, queso y vegetales'},
        {c:'PERROS CALIENTES', n:'Perro Especial', p:9000, d:'Pan, salchicha, carne o pollo desmechado, jamón y vegetales'},
        {c:'PERROS CALIENTES', n:'Perro Americano', p:13000, d:'Pan, salchicha, dos proteínas, tocino, jamón y vegetales'}
    ];

    let carrito = [], pedidoID = null, t = 60, timer;

    // Función de voz optimizada
    function hablar(texto) { 
        window.speechSynthesis.cancel();
        const msg = new SpeechSynthesisUtterance(texto); 
        msg.lang = 'es-ES'; 
        msg.rate = 0.9;
        window.speechSynthesis.speak(msg); 
    }

    function ir(id) { 
        document.querySelectorAll('.seccion').forEach(s => s.classList.remove('activa')); 
        document.getElementById(id).classList.add('activa'); 
    }

    function cargarMenu() {
        if(!document.getElementById('user').value) return alert("Ingresa tu nombre");
        ir('p-menu');
        let html = "", cat = "";
        menuCarlos.forEach((i, idx) => {
            if(i.c !== cat) { cat = i.c; html += `<div class="cat">${cat}</div>`; }
            html += `<div class="card">
                        <div class="card-h"><span>${i.n}</span><span>$${i.p.toLocaleString()}</span></div>
                        <p class="card-d">${i.d}</p>
                        <textarea id="obs-${idx}" placeholder="Notas: sin cebolla, sin salsas, ensalada sin azúcar..."></textarea>
                        <button onclick="add('${i.n}',${i.p}, ${idx})">+ AÑADIR AL CARRITO</button>
                     </div>`;
        });
        document.getElementById('lista').innerHTML = html;
        hablar("Bienvenido a Antojitos. Elige tu comida favorita.");
    }

    function add(n, p, idx) { 
        const nota = document.getElementById(`obs-${idx}`).value;
        carrito.push({n, p, nota}); 
        document.getElementById('tot').innerText = carrito.reduce((s,i)=>s+i.p,0).toLocaleString(); 
        document.getElementById(`obs-${idx}`).value = "";
        alert("Agregado: " + n);
    }

    function enviarPedido() {
        if(!carrito.length) return alert("Añade algo al carrito");
        const ref = db.ref('pedidos/').push({ 
            cliente: document.getElementById('user').value, 
            items: carrito, 
            total: document.getElementById('tot').innerText, 
            listo: false, can: false, hora: new Date().toLocaleTimeString()
        });
        pedidoID = ref.key;
        document.getElementById('f-cli').style.display = 'none';
        document.getElementById('status').style.display = 'block';
        document.getElementById('msg').innerText = "Pedido enviado. Carlos lo está preparando...";
        
        t = 60;
        timer = setInterval(() => {
            t--; document.getElementById('btn-can').innerText = `CANCELAR PEDIDO (${t}s)`;
            if(t <= 0) { clearInterval(timer); document.getElementById('btn-can').style.display = 'none'; }
        }, 1000);

        db.ref('pedidos/'+pedidoID).on('value', s => { 
            if(s.val()?.listo) { 
                hablar("¡Tu pedido está listo! Ya puedes pasar por él."); 
                document.getElementById('msg').innerHTML = "<span style='color:var(--verde)'>¡PEDIDO LISTO PARA RECOGER!</span>";
            } 
        });
    }

    function cancelar() {
        if(confirm("¿Quieres cancelar el pedido?")) { 
            db.ref('pedidos/'+pedidoID).update({can: true}); 
            clearInterval(timer); 
            location.reload(); 
        }
    }

    function accesoCarlos() {
        if(prompt("Clave:") === "antojitos2026") {
            ir('p-adm');
            db.ref('pedidos/').on('value', s => {
                const contenedor = document.getElementById('pedidos');
                const nAnterior = contenedor.childElementCount; 
                contenedor.innerHTML = "";
                s.forEach(h => {
                    const p = h.val();
                    if(!p.listo) {
                        let itemsHtml = p.items.map(i => `
                            • <b>${i.n}</b> 
                            ${i.nota ? `<div class="nota-roja">⚠️ NOTA: ${i.nota}</div>` : ''}
                        `).join('<br>');

                        contenedor.innerHTML += `<div class="ticket" style="${p.can?'opacity:0.4;border-left-color:red':''}">
                            <b>${p.cliente.toUpperCase()}</b> (${p.hora}) ${p.can?'<b style="color:red">[CANCELADO]</b>':''}<br>
                            <hr>${itemsHtml}<hr>
                            <b>Total: $${p.total}</b><br>
                            ${!p.can ? `<button onclick="db.ref('pedidos/${h.key}').update({listo:true})" style="background:var(--verde); color:#fff; margin-top:10px">MARCAR COMO LISTO</button>` : ''}
                        </div>`;
                        
                        if(p.can && !h.vistoVozCan) { hablar("¡Atención Carlos! El pedido de " + p.cliente + " fue cancelado."); h.vistoVozCan=true; }
                    }
                });
                if(contenedor.childElementCount > nAnterior && nAnterior !== 0) { 
                    hablar("¡Atención Carlos! Tienes un nuevo pedido entrante."); 
                }
            });
        }
    }
</script>
</body>
</html>
