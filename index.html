<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antojitos - Menú Profesional</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <style>
        body { background-color: #000; color: #d4af37; font-family: 'Segoe UI', sans-serif; padding: 10px; }
        .container { 
            max-width: 500px; margin: auto; border: 2px solid #d4af37; 
            padding: 20px; border-radius: 15px; background: #111;
            box-shadow: 0px 0px 15px rgba(212, 175, 55, 0.2);
        }
        h1 { text-align: center; font-size: 1.8em; color: #d4af37; text-shadow: 2px 2px #000; }
        .pantalla { display: none; }
        .activa { display: block; }
        
        input, textarea { 
            width: 100%; padding: 12px; margin: 10px 0; 
            background: #222; border: 1px solid #d4af37; 
            color: #fff; border-radius: 8px; box-sizing: border-box;
        }
        
        .producto-card { 
            background: #1a1a1a; border: 1px solid #333; 
            padding: 15px; border-radius: 10px; margin-bottom: 15px; 
        }
        
        button { 
            width: 100%; padding: 15px; background: #d4af37; 
            color: #000; border: none; font-weight: bold; 
            border-radius: 8px; cursor: pointer; font-size: 1em;
        }
        button:hover { background: #fff; color: #000; }
        .total-box { text-align: center; font-size: 1.2em; margin: 15px 0; color: #2ecc71; }
    </style>
</head>
<body>

<div class="container">
    <div id="paso1" class="pantalla activa">
        <h1>ANTOJITOS</h1>
        <p style="text-align: center;">Bienvenido. Por favor, identifícate:</p>
        <input type="text" id="nombreCliente" placeholder="Ingresa tu nombre completo">
        <button onclick="irAlMenu()">INGRESAR COMO CLIENTE</button>
    </div>

    <div id="paso2" class="pantalla">
        <h2 id="bienvenida" style="text-align: center;"></h2>
        
        <div class="producto-card">
            <label>🍔 <strong>Hamburguesas</strong> (8k Sencilla / 13k Especial)</label>
            <input type="number" id="cant_h" value="0" min="0" onchange="calcular()">
            <textarea id="obs_h" placeholder="Ej: La 1era sin cebolla, la 2da con todo..."></textarea>
        </div>

        <div class="producto-card">
            <label>🍟 <strong>Salchipapas</strong> (10k)</label>
            <input type="number" id="cant_s" value="0" min="0" onchange="calcular()">
            <textarea id="obs_s" placeholder="Especificaciones para tus salchipapas..."></textarea>
        </div>

        <div class="total-box">
            Total a Pagar: $<span id="montoTotal">0</span>
        </div>

        <button onclick="enviarFinal()">CONFIRMAR PEDIDO</button>
    </div>
</div>

<script>
    // CONFIGURACIÓN DE FIREBASE (Usa tus credenciales aquí)
    const firebaseConfig = {
        apiKey: "TU_API_KEY",
        databaseURL: "https://tu-proyecto.firebaseio.com",
        projectId: "tu-proyecto",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let nombre = "";

    function irAlMenu() {
        nombre = document.getElementById('nombreCliente').value.trim();
        if(nombre === "") return alert("Debes poner un nombre.");
        
        document.getElementById('paso1').classList.remove('activa');
        document.getElementById('paso2').classList.add('activa');
        document.getElementById('bienvenida').innerText = "Cliente: " + nombre;
    }

    function calcular() {
        let h = document.getElementById('cant_h').value * 10000; // Precio promedio ajustable
        let s = document.getElementById('cant_s').value * 10000;
        document.getElementById('montoTotal').innerText = h + s;
    }

    function enviarFinal() {
        const pedido = {
            cliente: nombre,
            hamburguesas: {
                cantidad: document.getElementById('cant_h').value,
                detalles: document.getElementById('obs_h').value
            },
            salchipapas: {
                cantidad: document.getElementById('cant_s').value,
                detalles: document.getElementById('obs_s').value
            },
            total: document.getElementById('montoTotal').innerText,
            hora: new Date().toLocaleTimeString(),
            fecha: new Date().toLocaleDateString()
        };

        db.ref('pedidos/').push(pedido).then(() => {
            alert("¡Listo " + nombre + "! Tu pedido llegó a Carlos. Retira en 30 min.");
            // REINICIO AUTOMÁTICO PARA EL SIGUIENTE CLIENTE
            location.reload(); 
        });
    }
</script>
</body>
</html>
