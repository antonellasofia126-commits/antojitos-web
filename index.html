<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antojitos - Menú Profesional</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root { --oro: #d4af37; --negro: #000; --gris: #1a1a1a; --verde: #2ecc71; }
        body { background-color: var(--negro); color: var(--oro); font-family: 'Segoe UI', Arial, sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 500px; margin: auto; border: 2px solid var(--oro); padding: 20px; border-radius: 15px; background: var(--gris); box-shadow: 0 0 20px rgba(212,175,55,0.3); }
        
        /* Sistema de Pantallas */
        .pantalla { display: none; visibility: hidden; }
        .activa { display: block !important; visibility: visible !important; }
        
        /* Estilo de Productos */
        .producto-card { background: #222; border: 1px solid #333; padding: 15px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 5px solid var(--oro); }
        .info h3 { margin: 0; color: #fff; font-size: 1.1em; }
        .info p { margin: 5px 0; color: var(--verde); font-weight: bold; }
        
        /* Carrito y Notas */
        .item-carrito { background: #000; padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #444; }
        textarea { width: 100%; padding: 10px; background: #111; border: 1px solid var(--oro); color: #fff; border-radius: 5px; box-sizing: border-box; margin-top: 10px; }
        
        input[type="text"] { width: 100%; padding: 15px; background: #222; border: 1px solid var(--oro); color: #fff; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--oro); color: #000; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; font-size: 1em; }
        .btn-add { width: auto; padding: 8px 15px; }
        .total-box { text-align: center; font-size: 2em; margin: 20px 0; padding: 15px; border: 2px solid var(--verde); color: var(--verde); background: #000; }
        
        /* Panel Carlos */
        .comanda { background: white; color: black; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 10px solid var(--oro); }
    </style>
</head>
<body>

<div class="container">
    <div id="pantalla1" class="pantalla activa">
        <h1 style="text-align:center">ANTOJITOS 🍔</h1>
        <p style="text-align:center">Bienvenido. ¿Cuál es tu nombre?</p>
        <input type="text" id="nombreInput" placeholder="Escribe tu nombre aquí...">
        <button onclick="abrirMenu()" style="margin-top:15px">INGRESAR AL MENÚ</button>
        <p onclick="irAdmin()" style="text-align:center; font-size:0.8em; margin-top:30px; color:#444; cursor:pointer">Acceso Administrador</p>
    </div>

    <div id="pantalla2" class="pantalla">
        <h2 id="txtBienvenida" style="text-align:center"></h2>
        
        <div id="lista-productos">
            <div class="producto-card">
                <div class="info"><h3>H. Sencilla</h3><p>$8.000</p></div>
                <button class="btn-add" onclick="alCarrito('H. Sencilla', 8000)">AÑADIR</button>
            </div>
            <div class="producto-card">
                <div class="info"><h3>H. Especial</h3><p>$13.000</p></div>
                <button class="btn-add" onclick="alCarrito('H. Especial', 13000)">AÑADIR</button>
            </div>
            <div class="producto-card">
                <div class="info"><h3>H. Super</h3><p>$19.000</p></div>
                <button class="btn-add" onclick="alCarrito('H. Super', 19000)">AÑADIR</button>
            </div>
            <div class="producto-card">
                <div class="info"><h3>Salchipapa</h3><p>$10.000</p></div>
                <button class="btn-add" onclick="alCarrito('Salchipapa', 10000)">AÑADIR</button>
            </div>
        </div>

        <div style="margin-top:30px; border-top: 1px solid var(--oro); padding-top:20px;">
            <h2 style="color:#fff">TU PEDIDO</h2>
            <div id="carrito-items"></div>
            <div class="total-box">TOTAL: $<span id="totalFinal">0</span></div>
            <button onclick="enviarAFirebase()" style="background:var(--verde); color:white; font-size:1.2em">CONFIRMAR PEDIDO</button>
        </div>
    </div>

    <div id="pantalla3" class="pantalla">
        <h1 style="color:var(--verde)">COCINA - ANTOJITOS</h1>
        <div id="pedidos-realtime"></div>
        <button onclick="location.reload()" style="background:#444; color:#fff; margin-top:20px">VOLVER</button>
    </div>
</div>

<script>
    // --- REEMPLAZA CON TUS CREDENCIALES DE FIREBASE ---
    const firebaseConfig = { apiKey: "TU_API", databaseURL: "TU_URL", projectId: "TU_ID" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let clienteActual = "";
    let miCarrito = [];

    // Pedir permiso de notificaciones de una vez
    if (Notification.permission !== "granted") {
        Notification.requestPermission();
    }

    function abrirMenu() {
        clienteActual = document.getElementById('nombreInput').value.trim();
        if(clienteActual === "") return alert("Por favor escribe tu nombre.");
        
        // Cambio de pantalla garantizado
        document.getElementById('pantalla1').classList.remove('activa');
        document.getElementById('pantalla2').classList.add('activa');
        document.getElementById('txtBienvenida').innerText = "Cliente: " + clienteActual;
    }

    function alCarrito(nombre, precio) {
        miCarrito.push({ nombre: nombre, precio: precio, nota: "" });
        dibujarCarrito();
    }

    function dibujarCarrito() {
        const contenedor = document.getElementById('carrito-items');
        contenedor.innerHTML = "";
        let suma = 0;
        miCarrito.forEach((item, i) => {
            suma += item.precio;
            contenedor.innerHTML += `
                <div class="item-carrito">
                    <div style="display:flex; justify-content:space-between">
                        <b>${item.nombre}</b> <b>$${item.precio}</b>
                    </div>
                    <textarea placeholder="¿Cómo la quieres? (Ej: Sin cebolla)" onchange="updateNota(${i}, this.value)">${item.nota}</textarea>
                    <button onclick="eliminar(${i})" style="background:none; color:red; font-size:0.7em; text-align:right; width:auto; padding:0">Eliminar</button>
                </div>`;
        });
        document.getElementById('totalFinal').innerText = suma;
    }

    function updateNota(i, val) { miCarrito[i].nota = val; }
    function eliminar(i) { miCarrito.splice(i, 1); dibujarCarrito(); }

    function enviarAFirebase() {
        if(miCarrito.length === 0) return alert("El carrito está vacío.");
        const pedido = {
            cliente: clienteActual,
            items: miCarrito,
            total: document.getElementById('totalFinal').innerText,
            hora: new Date().toLocaleTimeString(),
            listo: false,
            avisoEnviado: false
        };
        const nuevoPedido = db.ref('pedidos/').push(pedido);
        const id = nuevoPedido.key;
        
        alert("¡Pedido enviado! Te avisaremos al celular cuando esté listo.");
        escucharEstado(id); // Activa el segundo plano
        
        // Bloquear botón para no repetir
        document.querySelector('button[onclick="enviarAFirebase()"]').disabled = true;
        document.querySelector('button[onclick="enviarAFirebase()"]').innerText = "COCINANDO...";
    }

    function escucharEstado(id) {
        db.ref('pedidos/' + id).on('value', snap => {
            const pedido = snap.val();
            if(pedido && pedido.listo && !pedido.avisoEnviado) {
                if (Notification.permission === "granted") {
                    new Notification("🍔 ¡Antojitos avisó!", {
                        body: `¡Hola ${clienteActual}! Tu comida ya salió de la cocina.`,
                        icon: "https://cdn-icons-png.flaticon.com/512/706/706164.png"
                    });
                }
                alert("¡TU PEDIDO ESTÁ LISTO!");
                db.ref('pedidos/' + id).update({ avisoEnviado: true });
            }
        });
    }

    function irAdmin() {
        if(prompt("Clave:") === "antojitos2026") {
            document.getElementById('pantalla1').classList.remove('activa');
            document.getElementById('pantalla3').classList.add('activa');
            cargarCocina();
        }
    }

    function cargarCocina() {
        db.ref('pedidos/').on('value', snap => {
            const div = document.getElementById('pedidos-realtime');
            div.innerHTML = "";
            snap.forEach(h => {
                const p = h.val();
                if(!p.listo) {
                    let detalleHtml = p.items.map(i => `• ${i.nombre}: ${i.nota}`).join('<br>');
                    div.innerHTML += `
                        <div class="comanda">
                            <strong>${p.cliente}</strong> (${p.hora})<br>
                            <div style="font-size:0.9em; margin:10px 0">${detalleHtml}</div>
                            <b>TOTAL: $${p.total}</b><br>
                            <button onclick="marcarListo('${h.key}')" style="background:green; color:white; height:auto; padding:5px; margin-top:10px">LISTO PARA ENTREGAR</button>
                        </div>`;
                }
            });
        });
    }

    function marcarListo(id) { db.ref('pedidos/' + id).update({ listo: true }); }
</script>
</body>
</html>
