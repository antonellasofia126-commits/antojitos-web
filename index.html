<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antojitos - Pedidos Inteligentes</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <style>
        :root { --oro: #d4af37; --negro: #000; --gris: #1a1a1a; --verde: #2ecc71; }
        body { background-color: var(--negro); color: var(--oro); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 550px; margin: auto; border: 2px solid var(--oro); padding: 20px; border-radius: 15px; background: var(--gris); box-shadow: 0 0 25px rgba(212,175,55,0.4); }
        .pantalla { display: none; }
        .activa { display: block !important; }
        
        /* ESTILO MENÚ */
        .producto-item { background: #222; border: 1px solid #333; padding: 12px; border-radius: 10px; margin-bottom: 10px; display: flex; justify-content: space-between; align-items: center; border-left: 4px solid var(--oro); }
        .info h3 { margin: 0; color: #fff; font-size: 1.1em; }
        .info p { margin: 5px 0; color: var(--verde); font-weight: bold; }
        .btn-add { background: var(--oro); border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }

        /* CARRITO */
        .item-carrito { background: #000; padding: 15px; border-radius: 8px; margin-bottom: 10px; border: 1px solid #444; }
        textarea { width: 100%; padding: 10px; background: #1a1a1a; border: 1px solid #444; color: #fff; border-radius: 5px; box-sizing: border-box; resize: none; }
        
        .total-box { text-align: center; font-size: 2em; margin: 20px 0; background: #000; padding: 15px; border: 2px solid var(--verde); color: var(--verde); font-weight: bold; }
        button.enviar { width: 100%; padding: 20px; background: var(--verde); color: white; border: none; border-radius: 10px; font-weight: bold; font-size: 1.2em; cursor: pointer; }
        
        /* PANEL CARLOS */
        .comanda-carlos { background: white; color: black; padding: 15px; border-radius: 10px; margin-bottom: 15px; border-left: 10px solid var(--oro); }
    </style>
</head>
<body>

<div class="container">
    <div id="paso1" class="pantalla activa">
        <h1 style="text-align:center">ANTOJITOS 🍔</h1>
        <p style="text-align:center">¡Bienvenido! Danos tu nombre:</p>
        <input type="text" id="nombreCliente" style="width:100%; padding:15px; margin-bottom:10px; background:#222; border:1px solid var(--oro); color:#fff; border-radius:8px;" placeholder="Ej: Jackson">
        <button onclick="entrar()" style="width:100%; padding:15px; background:var(--oro); font-weight:bold; border-radius:8px; cursor:pointer;">VER MENÚ</button>
        <p onclick="verCocina()" style="text-align:center; font-size:0.7em; margin-top:40px; color:#444; cursor:pointer">Panel Admin</p>
    </div>

    <div id="paso2" class="pantalla">
        <h2 id="saludoCliente" style="text-align:center"></h2>
        <div id="menu-digital">
            <div class="producto-item"><div class="info"><h3>H. Sencilla</h3><p>$8.000</p></div><button class="btn-add" onclick="agregar('H. Sencilla', 8000)">+ AÑADIR</button></div>
            <div class="producto-item"><div class="info"><h3>H. Especial</h3><p>$13.000</p></div><button class="btn-add" onclick="agregar('H. Especial', 13000)">+ AÑADIR</button></div>
            <div class="producto-item"><div class="info"><h3>H. Super</h3><p>$19.000</p></div><button class="btn-add" onclick="agregar('H. Super', 19000)">+ AÑADIR</button></div>
            <div class="producto-item"><div class="info"><h3>Salchipapa</h3><p>$10.000</p></div><button class="btn-add" onclick="agregar('Salchipapa', 10000)">+ AÑADIR</button></div>
        </div>

        <div class="carrito-seccion">
            <h2 style="color:#fff">MI PEDIDO</h2>
            <div id="lista-carrito"></div>
            <div class="total-box">TOTAL: $<span id="montoTotal">0</span></div>
            <button class="enviar" id="btnEnviar" onclick="enviarPedido()">CONFIRMAR Y ENVIAR</button>
        </div>
    </div>

    <div id="paso3" class="pantalla">
        <h1 style="color:var(--verde)">SISTEMA DE COCINA</h1>
        <div id="pedidos-firebase"></div>
        <button onclick="location.reload()" style="width:100%; padding:10px; background:#444; color:#fff; border:none; margin-top:20px; border-radius:5px;">SALIR</button>
    </div>
</div>

<script>
    const firebaseConfig = { apiKey: "TU_API", databaseURL: "TU_URL", projectId: "TU_ID" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let cliente = "";
    let carrito = [];
    let pedidoID = null;

    // Solicitar permiso de notificaciones al cargar
    if (Notification.permission !== "granted") {
        Notification.requestPermission();
    }

    function entrar() {
        cliente = document.getElementById('nombreCliente').value.trim();
        if(!cliente) return alert("Por favor, ingresa tu nombre.");
        document.getElementById('paso1').classList.remove('activa');
        document.getElementById('paso2').classList.add('activa');
        document.getElementById('saludoCliente').innerText = "Hola, " + cliente;
    }

    function agregar(nombre, precio) {
        carrito.push({ nombre: nombre, precio: precio, nota: "" });
        actualizarInterfaz();
    }

    function actualizarInterfaz() {
        const div = document.getElementById('lista-carrito');
        div.innerHTML = "";
        let suma = 0;
        carrito.forEach((prod, index) => {
            suma += prod.precio;
            div.innerHTML += `<div class="item-carrito"><h4>${prod.nombre} <span>$${prod.precio}</span></h4><textarea onchange="guardarNota(${index}, this.value)">${prod.nota}</textarea></div>`;
        });
        document.getElementById('montoTotal').innerText = suma;
    }

    function guardarNota(idx, texto) { carrito[idx].nota = texto; }

    function enviarPedido() {
        if(carrito.length === 0) return alert("Carrito vacío");
        const pedido = { cliente: cliente, items: carrito, total: document.getElementById('montoTotal').innerText, listo: false, notificado: false };
        
        const ref = db.ref('pedidos/').push(pedido);
        pedidoID = ref.key; // Guardamos el ID para escuchar el cambio
        
        alert("¡Pedido enviado! Puedes cerrar esta pestaña, te avisaremos cuando esté listo.");
        escucharEstadoPedido(pedidoID);
        document.getElementById('btnEnviar').disabled = true;
        document.getElementById('btnEnviar').innerText = "ESPERANDO COMIDA...";
    }

    // ESTA FUNCIÓN SE QUEDA TRABAJANDO EN SEGUNDO PLANO
    function escucharEstadoPedido(id) {
        db.ref('pedidos/' + id).on('value', snapshot => {
            const data = snapshot.val();
            if (data && data.listo && !data.notificado) {
                // Disparar notificación real del sistema
                if (Notification.permission === "granted") {
                    new Notification("🍔 ¡Antojitos Avisa!", {
                        body: `¡Hola ${cliente}! Tu pedido ya está listo. Pasa por él.`,
                        icon: "https://cdn-icons-png.flaticon.com/512/706/706164.png"
                    });
                }
                alert("¡TU PEDIDO ESTÁ LISTO!");
                db.ref('pedidos/' + id).update({ notificado: true });
            }
        });
    }

    function verCocina() {
        if(prompt("Clave:") === "antojitos2026") {
            document.getElementById('paso1').classList.remove('activa');
            document.getElementById('paso3').classList.add('activa');
            cargarCocina();
        }
    }

    function cargarCocina() {
        db.ref('pedidos/').on('value', snap => {
            const container = document.getElementById('pedidos-firebase');
            container.innerHTML = "";
            snap.forEach(hijo => {
                const d = hijo.val();
                if(!d.listo) {
                    let items = d.items.map(i => `• ${i.nombre}: ${i.nota}`).join('<br>');
                    container.innerHTML += `<div class="comanda-carlos"><strong>${d.cliente}</strong><br>${items}<br><b>$${d.total}</b><br><button onclick="marcarListo('${hijo.key}')" class="btn-add" style="width:100%; margin-top:10px; background:green; color:white;">MARCAR LISTO ✓</button></div>`;
                }
            });
        });
    }

    function marcarListo(id) { db.ref('pedidos/' + id).update({ listo: true }); }
</script>
</body>
</html>
