<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antojitos - Sistema Infalible</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root { --oro: #d4af37; --negro: #000; --gris: #121212; --verde: #2ecc71; }
        body { background-color: var(--negro); color: var(--oro); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 15px; }
        
        /* FUERZA BRUTA: Eliminamos cualquier transición que pueda fallar */
        .seccion { display: none !important; }
        .activa { display: block !important; }

        .container { max-width: 500px; margin: auto; background: var(--gris); border: 2px solid var(--oro); padding: 20px; border-radius: 15px; }
        input, button, textarea { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--oro); box-sizing: border-box; }
        
        button { background: var(--oro); color: black; font-weight: bold; cursor: pointer; border: none; font-size: 1.1em; }
        
        .producto-card { background: #1f1f1f; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 5px solid var(--oro); display: flex; justify-content: space-between; align-items: center; }
        .carrito-item { background: #000; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #333; }
        textarea { background: #111; color: white; height: 70px; resize: none; border: 1px solid #444; }
        
        .total-box { text-align: center; color: var(--verde); font-size: 24px; font-weight: bold; border: 2px solid var(--verde); padding: 10px; margin: 15px 0; }
    </style>
</head>
<body>

<div class="container">
    <div id="p-inicio" class="seccion activa">
        <h1 style="text-align:center">ANTOJITOS 🍔</h1>
        <input type="text" id="nom-cli" placeholder="Escribe tu nombre...">
        <button type="button" id="btn-entrar">INGRESAR AL MENÚ</button>
        <p id="abrir-admin" style="text-align:center; color:#555; cursor:pointer; margin-top:30px">Panel Admin</p>
    </div>

    <div id="p-menu" class="seccion">
        <h2 id="bienvenida" style="text-align:center"></h2>
        <div id="tienda">
            <div class="producto-card"><span>H. Sencilla - $8.000</span> <button onclick="agregar('H. Sencilla', 8000)" style="width:auto; padding:8px">ADD</button></div>
            <div class="producto-card"><span>H. Especial - $13.000</span> <button onclick="agregar('H. Especial', 13000)" style="width:auto; padding:8px">ADD</button></div>
            <div class="producto-card"><span>H. Super - $19.000</span> <button onclick="agregar('H. Super', 19000)" style="width:auto; padding:8px">ADD</button></div>
            <div class="producto-card"><span>Salchipapa - $10.000</span> <button onclick="agregar('Salchipapa', 10000)" style="width:auto; padding:8px">ADD</button></div>
        </div>

        <div style="margin-top:20px; border-top:1px solid #333; padding-top:20px">
            <h3>Tu Carrito</h3>
            <div id="lista-carrito"></div>
            <div class="total-box">TOTAL: $<span id="total">0</span></div>
            <button onclick="enviarPedido()" style="background:var(--verde); color:white">ENVIAR PEDIDO</button>
        </div>
    </div>

    <div id="p-carlos" class="seccion">
        <h1 style="color:var(--verde); text-align:center">COCINA</h1>
        <div id="pedidos-realtime"></div>
        <button onclick="window.location.reload()">SALIR</button>
    </div>
</div>

<script>
    // 1. CONFIGURACIÓN INMEDIATA
    const config = { apiKey: "TU_API", databaseURL: "TU_URL", projectId: "TU_ID" };
    let db;

    // Intentamos conectar sin bloquear el resto del código
    try {
        firebase.initializeApp(config);
        db = firebase.database();
    } catch(e) { console.log("Firebase pendiente..."); }

    let cliente = "";
    let carrito = [];

    // 2. ESCUCHADORES DE EVENTOS (MANUAL PARA QUE NO FALLE)
    document.getElementById('btn-entrar').onclick = function() {
        cliente = document.getElementById('nom-cli').value.trim();
        if(cliente === "") return alert("Escribe tu nombre.");

        // CAMBIO DE PANTALLA INMEDIATO
        document.getElementById('p-inicio').classList.remove('activa');
        document.getElementById('p-menu').classList.add('activa');
        document.getElementById('bienvenida').innerText = "Hola, " + cliente;
    };

    document.getElementById('abrir-admin').onclick = function() {
        if(prompt("Clave:") === "antojitos2026") {
            document.getElementById('p-inicio').classList.remove('activa');
            document.getElementById('p-carlos').classList.add('activa');
            cargarPedidos();
        }
    };

    // 3. LÓGICA DEL CARRITO
    function agregar(nombre, precio) {
        carrito.push({ nombre, precio, nota: "" });
        render();
    }

    function render() {
        const div = document.getElementById('lista-carrito');
        div.innerHTML = "";
        let t = 0;
        carrito.forEach((p, i) => {
            t += p.precio;
            div.innerHTML += `<div class="carrito-item">
                <b>${p.nombre} ($${p.precio})</b>
                <textarea onchange="carrito[${i}].nota=this.value" placeholder="¿Cómo la quieres?"></textarea>
                <button onclick="carrito.splice(${i},1);render()" style="background:red; color:white; width:auto; padding:5px; font-size:12px">Quitar</button>
            </div>`;
        });
        document.getElementById('total').innerText = t;
    }

    // 4. ENVÍO Y NOTIFICACIONES
    function enviarPedido() {
        if(carrito.length === 0) return alert("Carrito vacío");
        if(!db) return alert("Error: Conecta bien Firebase.");

        const pedido = { cliente, items: carrito, total: document.getElementById('total').innerText, listo: false, avisado: false };
        const ref = db.ref('pedidos/').push(pedido);
        
        alert("¡Pedido enviado! Carlos ya lo recibió.");

        db.ref('pedidos/' + ref.key).on('value', s => {
            const p = s.val();
            if(p && p.listo && !p.avisado) {
                if (Notification.permission === "granted") {
                    new Notification("🍔 Antojitos", { body: "¡Tu pedido está listo!" });
                }
                alert("¡YA ESTÁ LISTO!");
                db.ref('pedidos/' + ref.key).update({ avisado: true });
            }
        });
    }

    function cargarPedidos() {
        db.ref('pedidos/').on('value', s => {
            const div = document.getElementById('pedidos-realtime');
            div.innerHTML = "";
            s.forEach(h => {
                const p = h.val();
                if(!p.listo) {
                    let items = p.items.map(i => `• ${i.nombre}: ${i.nota}`).join('<br>');
                    div.innerHTML += `<div style="background:white; color:black; padding:15px; margin-bottom:10px; border-radius:10px">
                        <b>${p.cliente}</b><br>${items}<br><b>$${p.total}</b><br>
                        <button onclick="db.ref('pedidos/${h.key}').update({listo:true})" style="background:green; color:white">LISTO</button>
                    </div>`;
                }
            });
        });
    }

    if (Notification.permission !== "granted") Notification.requestPermission();
</script>
</body>
</html>
