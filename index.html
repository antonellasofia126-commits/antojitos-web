<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antojitos - Menú Premium</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <style>
        :root { --oro: #d4af37; --negro: #000; --gris: #1a1a1a; }
        body { background-color: var(--negro); color: var(--oro); font-family: 'Segoe UI', sans-serif; padding: 10px; margin: 0; }
        .container { max-width: 550px; margin: auto; border: 2px solid var(--oro); padding: 20px; border-radius: 15px; background: var(--gris); box-shadow: 0 0 25px rgba(212,175,55,0.3); }
        
        /* Control de pantallas */
        .pantalla { display: none; }
        .activa { display: block !important; }
        
        h1, h2 { text-align: center; color: var(--oro); text-transform: uppercase; letter-spacing: 2px; }
        
        /* Carta de Precios */
        .menu-precios { background: #000; border: 1px solid var(--oro); padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .menu-precios div { display: flex; justify-content: space-between; border-bottom: 1px solid #333; padding: 5px 0; }
        .item-p { color: #fff; font-size: 0.9em; }
        .costo-p { color: #2ecc71; font-weight: bold; }

        .card { background: #222; border: 1px solid var(--oro); padding: 15px; border-radius: 10px; margin-bottom: 20px; }
        .item-nuevo { background: #333; padding: 12px; margin-top: 10px; border-radius: 8px; border-left: 5px solid var(--oro); }
        
        input, textarea { width: 100%; padding: 12px; margin: 8px 0; background: #000; border: 1px solid #444; color: #fff; border-radius: 6px; box-sizing: border-box; }
        
        button { width: 100%; padding: 15px; background: var(--oro); color: #000; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; transition: 0.3s; }
        button:hover { background: #fff; }
        
        .total-banner { text-align: center; font-size: 2em; margin: 20px 0; color: #2ecc71; border: 2px dashed var(--oro); padding: 10px; background: #000; }
        
        /* Comandas Carlos */
        .comanda-carlos { background: white; color: black; padding: 15px; border-radius: 8px; margin-bottom: 10px; border-left: 10px solid var(--oro); }
    </style>
</head>
<body>

<div class="container">
    <div id="paso1" class="pantalla activa">
        <h1>ANTOJITOS 🍔</h1>
        <p style="text-align:center">Bienvenido. Ingrese su nombre para ordenar:</p>
        <input type="text" id="nombreCliente" placeholder="Ej: Jackson">
        <button onclick="entrarAlMenu()">VER LA CARTA</button>
        <p onclick="verCocina()" style="text-align:center; font-size:0.7em; margin-top:30px; color:#444; cursor:pointer">Panel Cocina (Admin)</p>
    </div>

    <div id="paso2" class="pantalla">
        <h2 id="bienvenida"></h2>
        
        <div class="menu-precios">
            <h3 style="text-align:center; margin-top:0">CARTA DE PRECIOS</h3>
            <div><span class="item-p">Hamburguesa Sencilla</span> <span class="costo-p">$8.000</span></div>
            <div><span class="item-p">Hamburguesa Especial</span> <span class="costo-p">$13.000</span></div>
            <div><span class="item-p">Hamburguesa Super</span> <span class="costo-p">$19.000</span></div>
            <div><span class="item-p">Salchipapas / Perro</span> <span class="costo-p">$10.000</span></div>
        </div>

        <div class="card">
            <h3>🛒 TU PEDIDO</h3>
            <label>¿Cuántos productos deseas llevar en total?</label>
            <input type="number" id="cantTotal" min="0" value="0" onchange="crearInputs()">
            <div id="listaProductos"></div>
        </div>

        <div class="total-banner">TOTAL: $<span id="sumaTotal">0</span></div>
        <button onclick="enviarPedido()">CONFIRMAR PEDIDO</button>
    </div>

    <div id="paso3" class="pantalla">
        <h1 style="color:#2ecc71">ORDENES RECIBIDAS</h1>
        <div id="panelCocina"></div>
        <button onclick="location.reload()" style="background:#444; color:#fff; margin-top:20px">VOLVER AL INICIO</button>
    </div>
</div>

<script>
    // --- CONFIGURACIÓN DE FIREBASE ---
    // REEMPLAZA ESTO CON TUS DATOS DE FIREBASE
    const firebaseConfig = {
        apiKey: "TU_API_KEY",
        databaseURL: "https://tu-proyecto.firebaseio.com",
        projectId: "tu-proyecto",
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let clienteNombre = "";

    function entrarAlMenu() {
        clienteNombre = document.getElementById('nombreCliente').value.trim();
        if(clienteNombre === "") {
            alert("Por favor, ingrese un nombre.");
            return;
        }
        document.getElementById('paso1').classList.remove('activa');
        document.getElementById('paso2').classList.add('activa');
        document.getElementById('bienvenida').innerText = "Cliente: " + clienteNombre;
    }

    function crearInputs() {
        const cantidad = document.getElementById('cantTotal').value;
        const contenedor = document.getElementById('listaProductos');
        contenedor.innerHTML = "";
        
        for(let i=1; i<=cantidad; i++) {
            contenedor.innerHTML += `
                <div class="item-nuevo">
                    <strong>Producto #${i}</strong>
                    <input type="number" class="p-precio" placeholder="Precio según carta (Ej: 13000)" onchange="actualizarTotal()">
                    <textarea class="p-nota" placeholder="Detalles: ¿Qué lleva? ¿Cómo lo quieres?"></textarea>
                </div>`;
        }
        actualizarTotal();
    }

    function actualizarTotal() {
        let suma = 0;
        document.querySelectorAll('.p-precio').forEach(inp => {
            suma += Number(inp.value) || 0;
        });
        document.getElementById('sumaTotal').innerText = suma;
    }

    function enviarPedido() {
        const total = document.getElementById('sumaTotal').innerText;
        if(total == 0) return alert("El pedido está vacío.");

        const listaItems = [];
        document.querySelectorAll('.item-nuevo').forEach(div => {
            listaItems.push({
                precio: div.querySelector('.p-precio').value,
                nota: div.querySelector('.p-nota').value
            });
        });

        const pedidoFinal = {
            cliente: clienteNombre,
            detalles: listaItems,
            total: total,
            hora: new Date().toLocaleTimeString(),
            listo: false
        };

        db.ref('pedidos/').push(pedidoFinal).then(() => {
            alert("¡Éxito " + clienteNombre + "! Pedido enviado por $" + total);
            location.reload();
        });
    }

    function verCocina() {
        if(prompt("Clave de Acceso:") === "antojitos2026") {
            document.getElementById('paso1').classList.remove('activa');
            document.getElementById('paso3').classList.add('activa');
            escucharPedidos();
        } else {
            alert("Clave incorrecta.");
        }
    }

    function escucharPedidos() {
        db.ref('pedidos/').on('value', snapshot => {
            const container = document.getElementById('panelCocina');
            container.innerHTML = "";
            snapshot.forEach(hijo => {
                const p = hijo.val();
                if(!p.listo) {
                    let itemsHTML = p.detalles.map(d => `• $${d.precio}: ${d.nota}`).join('<br>');
                    container.innerHTML += `
                        <div class="comanda-carlos">
                            <strong>${p.cliente}</strong> <small>(${p.hora})</small><br>
                            <div style="font-size:0.9em; margin:5px 0">${itemsHTML}</div>
                            <b>TOTAL: $${p.total}</b><br>
                            <button onclick="terminarPedido('${hijo.key}')" style="background:green; color:white; padding:5px; margin-top:5px; height:auto">✓ ENTREGAR</button>
                        </div>`;
                }
            });
        });
    }

    function terminarPedido(id) {
        db.ref('pedidos/' + id).update({ listo: true });
    }
</script>

</body>
</html>
