<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antojitos - Sistema Integral</title>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.0.0/firebase-database-compat.js"></script>

    <style>
        :root { --oro: #d4af37; --negro: #000; --gris: #1a1a1a; }
        body { background-color: var(--negro); color: var(--oro); font-family: 'Segoe UI', sans-serif; margin: 0; padding: 10px; }
        .container { max-width: 600px; margin: auto; border: 2px solid var(--oro); padding: 20px; border-radius: 15px; background: var(--gris); box-shadow: 0 0 20px rgba(212,175,55,0.2); }
        .pantalla { display: none; }
        .activa { display: block; }
        
        /* Estilos de Menú */
        .producto-card { background: #222; border-left: 4px solid var(--oro); padding: 15px; border-radius: 8px; margin-bottom: 15px; }
        input, textarea { width: 100%; padding: 10px; margin: 8px 0; background: #333; border: 1px solid var(--oro); color: #fff; border-radius: 5px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: var(--oro); color: #000; border: none; font-weight: bold; border-radius: 8px; cursor: pointer; text-transform: uppercase; }
        
        /* Estilos Panel de Carlos */
        .comanda { background: #fff; color: #000; padding: 15px; margin-bottom: 10px; border-radius: 8px; border-left: 10px solid #27ae60; }
        .btn-cocinado { background: #c0392b; color: white; padding: 5px; font-size: 0.8em; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <div id="pantalla-inicio" class="pantalla activa">
        <h1 style="text-align:center">ANTOJITOS 🍔</h1>
        <input type="text" id="nombreCliente" placeholder="¿Cuál es tu nombre?">
        <button onclick="entrarMenu()">VER MENÚ</button>
        <p onclick="irACarlos()" style="font-size: 0.7em; text-align: center; margin-top: 20px; color: #444;">Acceso Admin</p>
    </div>

    <div id="pantalla-cliente" class="pantalla">
        <h2 id="holaUser" style="text-align:center"></h2>
        
        <div id="menu-items">
            <div class="producto-card">
                <label>🍔 HAMBURGUESAS (8k / 13k)</label>
                <input type="number" id="h_cant" placeholder="Cantidad" min="0">
                <textarea id="h_obs" placeholder="Ej: La 1ra sin cebolla, la 2da de 13k con todo..."></textarea>
            </div>

            <div class="producto-card">
                <label>🌭 PERROS CALIENTES (6k / 10k)</label>
                <input type="number" id="p_cant" placeholder="Cantidad" min="0">
                <textarea id="p_obs" placeholder="Ej: Sin mostaza..."></textarea>
            </div>

            <div class="producto-card">
                <label>🍗 POLLO FRITO (Combos)</label>
                <input type="number" id="po_cant" placeholder="Cantidad" min="0">
                <textarea id="po_obs" placeholder="Especificaciones del pollo..."></textarea>
            </div>

            <div class="producto-card">
                <label>🍟 SALCHIPAPAS (10k)</label>
                <input type="number" id="s_cant" placeholder="Cantidad" min="0">
                <textarea id="s_obs" placeholder="Detalles de las salchipapas..."></textarea>
            </div>
        </div>

        <button onclick="enviarPedido()">CONFIRMAR PEDIDO</button>
    </div>

    <div id="pantalla-carlos" class="pantalla">
        <h1 style="color: #27ae60">PANEL DE COCINA</h1>
        <div id="lista-pedidos">
            </div>
        <button onclick="location.reload()" style="background:#444; color:white">VOLVER AL INICIO</button>
    </div>
</div>

<script>
    // CONFIGURACIÓN FIREBASE (Pon tus datos reales)
    const firebaseConfig = { apiKey: "TU_API", databaseURL: "TU_URL", projectId: "TU_ID" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let user = "";

    function entrarMenu() {
        user = document.getElementById('nombreCliente').value.trim();
        if(!user) return alert("Dinos tu nombre");
        document.getElementById('pantalla-inicio').classList.remove('activa');
        document.getElementById('pantalla-cliente').classList.add('activa');
        document.getElementById('holaUser').innerText = "Hola, " + user;
    }

    function enviarPedido() {
        const pedido = {
            cliente: user,
            items: {
                hamburguesas: { cant: document.getElementById('h_cant').value, obs: document.getElementById('h_obs').value },
                perros: { cant: document.getElementById('p_cant').value, obs: document.getElementById('p_obs').value },
                pollo: { cant: document.getElementById('po_cant').value, obs: document.getElementById('po_obs').value },
                salchipapas: { cant: document.getElementById('s_cant').value, obs: document.getElementById('s_obs').value }
            },
            hora: new Date().toLocaleTimeString(),
            listo: false
        };

        db.ref('pedidos/').push(pedido).then(() => {
            alert("¡Pedido enviado! Carlos ya lo tiene.");
            location.reload();
        });
    }

    function irACarlos() {
        document.getElementById('pantalla-inicio').classList.remove('activa');
        document.getElementById('pantalla-carlos').classList.add('activa');
        cargarPedidos();
    }

    function cargarPedidos() {
        db.ref('pedidos/').on('value', (snapshot) => {
            const div = document.getElementById('lista-pedidos');
            div.innerHTML = "";
            snapshot.forEach((child) => {
                const p = child.val();
                if(!p.listo) {
                    div.innerHTML += `
                        <div class="comanda">
                            <strong>CLIENTE: ${p.cliente}</strong> (${p.hora})<br>
                            ${p.items.hamburguesas.cant > 0 ? '🍔 H: ' + p.items.hamburguesas.cant + ' - ' + p.items.hamburguesas.obs : ''}<br>
                            ${p.items.salchipapas.cant > 0 ? '🍟 S: ' + p.items.salchipapas.cant + ' - ' + p.items.salchipapas.obs : ''}<br>
                            <button class="btn-cocinado" onclick="marcarListo('${child.key}')">MARCAR COMO ENTREGADO</button>
                        </div>`;
                }
            });
        });
    }

    function marcarListo(id) {
        db.ref('pedidos/' + id).update({ listo: true });
    }
</script>
</body>
</html>
