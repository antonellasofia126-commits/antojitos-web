<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Antojitos Gold - Sistema de Pedidos</title>
    
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>

    <style>
        :root { --oro: #d4af37; --negro: #000; --gris: #121212; --verde: #2ecc71; }
        body { background-color: var(--negro); color: var(--oro); font-family: sans-serif; margin: 0; padding: 15px; }
        
        /* FUERZA BRUTA PARA PANTALLAS */
        .seccion { display: none !important; }
        .activa { display: block !important; }

        .container { max-width: 500px; margin: auto; background: var(--gris); border: 2px solid var(--oro); padding: 20px; border-radius: 15px; }
        input, button, textarea { width: 100%; padding: 15px; margin: 10px 0; border-radius: 10px; border: 1px solid var(--oro); box-sizing: border-box; }
        button { background: var(--oro); color: black; font-weight: bold; cursor: pointer; }
        
        .producto-card { background: #1f1f1f; padding: 15px; border-radius: 10px; margin-bottom: 10px; border-left: 5px solid var(--oro); display: flex; justify-content: space-between; align-items: center; }
        .carrito-item { background: #000; padding: 15px; border-radius: 10px; margin-bottom: 10px; border: 1px solid #333; }
        textarea { background: #111; color: white; height: 60px; }
    </style>
</head>
<body>

<div class="container">
    <div id="p-inicio" class="seccion activa">
        <h1 style="text-align:center">ANTOJITOS 🍔</h1>
        <input type="text" id="nom-cli" placeholder="Escribe tu nombre...">
        <button onclick="entrarAlSistema()">INGRESAR AL MENÚ</button>
        <p onclick="irCocina()" style="text-align:center; color:#444; cursor:pointer; font-size:0.8em">Admin Carlos</p>
    </div>

    <div id="p-menu" class="seccion">
        <h2 id="bienvenida" style="text-align:center"></h2>
        
        <div id="tienda">
            <div class="producto-card"><span>H. Sencilla - $8.000</span> <button onclick="agregar('H. Sencilla', 8000)" style="width:auto">ADD</button></div>
            <div class="producto-card"><span>H. Especial - $13.000</span> <button onclick="agregar('H. Especial', 13000)" style="width:auto">ADD</button></div>
            <div class="producto-card"><span>H. Super - $19.000</span> <button onclick="agregar('H. Super', 19000)" style="width:auto">ADD</button></div>
            <div class="producto-card"><span>Salchipapa - $10.000</span> <button onclick="agregar('Salchipapa', 10000)" style="width:auto">ADD</button></div>
        </div>

        <div style="margin-top:20px; border-top:2px dashed var(--oro); padding-top:20px">
            <h3>Tu Carrito (Añade varios productos)</h3>
            <div id="lista-carrito"></div>
            <h2 style="text-align:center; color:var(--verde)">TOTAL: $<span id="total">0</span></h2>
            <button onclick="enviarPedido()" style="background:var(--verde); color:white">CONFIRMAR PEDIDO</button>
        </div>
    </div>

    <div id="p-carlos" class="seccion">
        <h1 style="color:var(--verde)">COCINA</h1>
        <div id="pedidos-realtime"></div>
        <button onclick="location.reload()" style="background:#444; color:white">SALIR</button>
    </div>
</div>

<script>
    // --- IMPORTANTE: CONFIGURA ESTO ---
    const firebaseConfig = { apiKey: "TU_API", databaseURL: "TU_URL", projectId: "TU_ID" };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let cliente = "";
    let carrito = [];

    // Pedir permiso notificaciones
    if (Notification.permission !== "granted") { Notification.requestPermission(); }

    function entrarAlSistema() {
        cliente = document.getElementById('nom-cli').value.trim();
        if(cliente === "") return alert("Pon tu nombre");

        // CAMBIO DE PANTALLA FORZADO
        document.getElementById('p-inicio').classList.remove('activa');
        document.getElementById('p-menu').classList.add('activa');
        document.getElementById('bienvenida').innerText = "Cliente: " + cliente;
    }

    function agregar(n, p) {
        carrito.push({ nombre: n, precio: p, nota: "" });
        renderizar();
    }

    function renderizar() {
        const div = document.getElementById('lista-carrito');
        div.innerHTML = "";
        let t = 0;
        carrito.forEach((prod, i) => {
            t += prod.precio;
            div.innerHTML += `
                <div class="carrito-item">
                    <b>${prod.nombre} - $${prod.precio}</b>
                    <textarea placeholder="Ej: Sin cebolla..." onchange="carrito[${i}].nota=this.value">${prod.nota}</textarea>
                    <button onclick="carrito.splice(${i},1);renderizar()" style="background:red; color:white; padding:5px; height:auto; width:auto">Quitar</button>
                </div>`;
        });
        document.getElementById('total').innerText = t;
    }

    function enviarPedido() {
        if(carrito.length === 0) return alert("Carrito vacío");
        const pedido = { cliente, items: carrito, total: document.getElementById('total').innerText, listo: false, avisado: false };
        const ref = db.ref('pedidos/').push(pedido);
        
        alert("¡Enviado! Carlos ya lo tiene. Recibirás una notificación al terminar.");
        
        // ESCUCHA EN SEGUNDO PLANO
        db.ref('pedidos/' + ref.key).on('value', s => {
            const p = s.val();
            if(p && p.listo && !p.avisado) {
                if (Notification.permission === "granted") {
                    new Notification("🍔 ¡Antojitos!", { body: "¡Tu pedido está listo!" });
                }
                alert("¡COMIDA LISTA!");
                db.ref('pedidos/' + ref.key).update({ avisado: true });
            }
        });
    }

    function irCocina() {
        if(prompt("Clave:") === "antojitos2026") {
            document.getElementById('p-inicio').classList.remove('activa');
            document.getElementById('p-carlos').classList.add('activa');
            cargarPedidos();
        }
    }

    function cargarPedidos() {
        db.ref('pedidos/').on('value', s => {
            const div = document.getElementById('pedidos-realtime');
            div.innerHTML = "";
            s.forEach(h => {
                const p = h.val();
                if(!p.listo) {
                    let itemsHtml = p.items.map(i => `• ${i.nombre}: ${i.nota}`).join('<br>');
                    div.innerHTML += `<div style="background:white; color:black; padding:15px; margin-bottom:10px; border-radius:10px;">
                        <strong>${p.cliente}</strong><br>${itemsHtml}<br><b>$${p.total}</b><br>
                        <button onclick="db.ref('pedidos/${h.key}').update({listo:true})" style="background:green; color:white">LISTO</button>
                    </div>`;
                }
            });
        });
    }
</script>
</body>
</html>
